version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: taskora_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskora_user
      POSTGRES_PASSWORD: taskora_pass
      POSTGRES_DB: taskora_db
    ports:
      - "5432:5432"
    volumes:
      - taskora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskora_user -d taskora_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskora_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://taskora_user:taskora_pass@db:5432/taskora_db
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  taskora_pgdata: