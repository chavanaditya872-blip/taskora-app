<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Task · Taskora</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="app-page">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">T</span> Taskora</div>
    <nav class="side-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="task.html" class="active">➕ New Task</a>
      <a href="profile.html">👤 Profile</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-mini">
        <div class="avatar" id="userAvatar">U</div>
        <div>
          <div id="userNameSide" class="user-name">User</div>
          <div id="userEmailSide" class="muted small">-</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-block" id="logoutBtn">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="hamburger" id="menuToggle">☰</button>
      <h1 id="pageTitle">Create Task</h1>
      <a href="dashboard.html" class="btn btn-ghost">← Back</a>
    </header>

    <section class="form-card">
      <form id="taskForm">
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" required maxlength="200" placeholder="e.g. Prepare quarterly report" />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4" maxlength="5000" placeholder="Add details…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="todo" selected>To Do</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="category_id">Category</label>
            <select id="category_id"><option value="">None</option></select>
          </div>
          <div class="form-group">
            <label for="due_date">Due date</label>
            <input type="datetime-local" id="due_date" />
          </div>
        </div>
        <div class="form-group">
          <label for="reminder_at">Reminder</label>
          <input type="datetime-local" id="reminder_at" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Save Task</button>
          <a href="dashboard.html" class="btn btn-ghost">Cancel</a>
        </div>
        <div class="form-message" id="formMessage"></div>
      </form>
    </section>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/tasks.js"></script>
  <script>
    // Edit mode: task.html?id=123
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('id');
    if (taskId) {
      document.getElementById('pageTitle').textContent = 'Edit Task';
      document.getElementById('submitBtn').textContent = 'Update Task';
      TaskPage.loadForEdit(taskId);
    } else {
      TaskPage.loadCategories();
    }
  </script>
</body>
</html>
