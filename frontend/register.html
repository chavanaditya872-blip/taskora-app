<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · Taskora</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="brand center"><span class="brand-mark">T</span> Taskora</a>
    <h2>Create your account</h2>
    <p class="muted">Start organizing your work in seconds.</p>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" required minlength="2" placeholder="Jane Doe" />
        <small class="error" data-error-for="full_name"></small>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
        <small class="error" data-error-for="email"></small>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters" />
        <small class="error" data-error-for="password"></small>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required />
        <small class="error" data-error-for="confirm_password"></small>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
      <div class="form-message" id="formMessage"></div>
    </form>

    <p class="muted center">Already registered? <a href="login.html">Log in</a></p>
  </div>
  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
