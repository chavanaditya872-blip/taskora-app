<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Taskora</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="brand center"><span class="brand-mark">T</span> Taskora</a>
    <h2>Welcome back</h2>
    <p class="muted">Log in to continue to your dashboard.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
        <small class="error" data-error-for="email"></small>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password" />
        <small class="error" data-error-for="password"></small>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Login</button>
      <div class="form-message" id="formMessage"></div>
    </form>

    <p class="muted center">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
